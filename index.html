<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1849b8">
<meta name="description" content="Americano- ja Mexicano-turnausten järjestäminen ja pisteenlasku.">
<title>Padel-turnaus</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Padel">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>
  // Teema ennen piirtoa (ei välähdystä): tallennettu valinta, muuten laitteen asetus.
  (function () {
    var t;
    try { t = localStorage.getItem('padel-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<link rel="stylesheet" href="style.css?v=7">
</head>
<body>
<header class="topbar">
  <h1>Padel-turnaus</h1>
  <nav class="nav">
    <button data-page="tournament">Turnaus</button>
    <button data-page="history">Historia</button>
  </nav>
  <label class="theme-switch" title="Vaihda vaalea / tumma tila">
    <input type="checkbox" id="themeToggle" role="switch" aria-label="Tumma tila">
    <span class="track" aria-hidden="true"><span class="thumb"></span></span>
  </label>
</header>
<main id="app"></main>
<dialog id="picker" aria-labelledby="pickerTitle"></dialog>
<script src="app.js?v=7"></script>
<script type="module" src="cloud.js?v=7"></script>
</body>
</html>
